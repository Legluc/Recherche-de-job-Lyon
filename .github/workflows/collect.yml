name: Collecte offres

on:
  schedule:
    # GitHub planifie en UTC. 18:00 UTC = 20:00 Europe/Paris en heure d'été (CEST).
    # En heure d'hiver (dès fin octobre), cela correspond à 19:00 Paris : ajuster à "0 19 * * 1-5" si besoin.
    - cron: "0 18 * * 1-5" # du lundi au vendredi
  workflow_dispatch: {} # permet aussi un lancement manuel depuis l'onglet Actions

jobs:
  collect:
    runs-on: ubuntu-latest
    strategy:
      # Une ville par job : logs séparés, et un échec sur une ville n'empêche
      # pas l'autre de tourner (fail-fast désactivé).
      fail-fast: false
      matrix:
        city: [lyon, annecy]
    name: Collecte ${{ matrix.city }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer les dépendances
        run: npm install
      - name: Lancer la collecte
        run: npm start
        env:
          CITY: ${{ matrix.city }}
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATABASE_ID_ANNECY: ${{ secrets.NOTION_DATABASE_ID_ANNECY }}
          MAX_INSERT: "60" # plafond d'insertions par run et par ville

name: Nettoyage Notion

# À lancer manuellement (onglet Actions -> Nettoyage Notion -> Run workflow)
# après une sur-collecte. Archive les offres "À traiter" (corbeille, réversible).
on:
  workflow_dispatch:
    inputs:
      city:
        description: "Ville à nettoyer"
        required: true
        default: lyon
        type: choice
        options: [lyon, annecy]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer les dépendances
        run: npm install
      - name: Nettoyer
        run: npm run cleanup
        env:
          CITY: ${{ inputs.city }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATABASE_ID_ANNECY: ${{ secrets.NOTION_DATABASE_ID_ANNECY }}
